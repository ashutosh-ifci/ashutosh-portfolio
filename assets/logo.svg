<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2d3748;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a5568;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Logo Container -->
  <rect x="5" y="5" width="70" height="70" rx="20" fill="url(#logoGradient)" stroke="#fff" stroke-width="2"/>
  
  <!-- Geometric Pattern -->
  <polygon points="15,25 35,15 55,25 45,45 25,45" fill="rgba(255,255,255,0.2)"/>
  <polygon points="25,35 45,25 65,35 55,55 35,55" fill="rgba(255,255,255,0.3)"/>
  
  <!-- AC Letters -->
  <text x="40" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">AC</text>
  
  <!-- Company Name -->
  <text x="90" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="url(#textGradient)">ASHUTOSH</text>
  <text x="90" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="400" fill="#718096">Software Developer</text>
  
  <!-- Tech Elements -->
  <circle cx="170" cy="20" r="3" fill="#667eea" opacity="0.6"/>
  <circle cx="180" cy="25" r="2" fill="#764ba2" opacity="0.6"/>
  <circle cx="175" cy="35" r="2.5" fill="#f093fb" opacity="0.6"/>
  
  <!-- Code Symbol -->
  <path d="M85 65 L88 62 L85 59" stroke="#667eea" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M95 59 L92 62 L95 65" stroke="#667eea" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>